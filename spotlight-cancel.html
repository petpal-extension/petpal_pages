<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Spotlight Cancelled</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center">
        <div class="mb-6">
            <svg class="w-16 h-16 text-gray-400 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-700 mb-4">Payment Cancelled</h1>
        <p class="text-gray-600 mb-6">Your pet spotlight purchase was cancelled. No worries - you can try again whenever you're ready!</p>
        <div class="mb-6">
            <div class="bg-blue-50 p-4 rounded-lg">
                <p class="text-blue-700">Simply return to the PetPal extension and click "Feature Your Pet" to try again.</p>
            </div>
        </div>
        <button id="close" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
            Close Window
        </button>
    </div>
    <script>
        document.getElementById('close').addEventListener('click', function() {
            window.close();
        });
    </script>
</body>
</html>
